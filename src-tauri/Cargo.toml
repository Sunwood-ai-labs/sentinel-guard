[package]
name = "sentinel-guard"
version = "0.1.0"
description = "Desktop telemetry & cross-tool credential access detector"
authors = ["Sunwood AI Labs"]
license = "MIT"
repository = "https://github.com/Sunwood-ai-labs/sentinel-guard"
edition = "2024"

[lib]
name = "sentinel_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.55"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
